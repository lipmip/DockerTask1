<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Редактирование')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap">
    <h1>Редактирование статьи</h1>
    <form class="card" th:action="@{/article/update}" th:object="${article}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="title">Заголовок</label>
        <input type="text" id="title" th:field="*{title}" maxlength="50" required>

        <label for="publishedDate">Дата публикации</label>
        <input type="date" id="publishedDate" th:field="*{publishedDate}">

        <label for="content">Текст</label>
        <textarea id="content" th:field="*{content}" required></textarea>

        <p class="row">
            <button type="submit">Сохранить</button>
            <a class="btn btn-light" th:href="@{/dashboard}">Отмена</a>
        </p>
    </form>
</main>
</body>
</html>
