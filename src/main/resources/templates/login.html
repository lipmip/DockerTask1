<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap" style="max-width: 420px">
    <h1>Вход</h1>
    <div class="alert alert-ok" th:if="${param.success != null}">Регистрация прошла успешно. Теперь войдите.</div>
    <div class="alert alert-ok" th:if="${param.logout != null}">Вы вышли из аккаунта.</div>
    <div class="alert alert-err" th:if="${param.error != null}">Неверный email или пароль.</div>
    <form class="card" th:action="@{/login/process}" method="post">
        <label for="username">Email</label>
        <input type="email" id="username" name="username" required autofocus>
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required>
        <p><button type="submit">Войти</button></p>
        <p class="muted">Нет аккаунта? <a th:href="@{/signup}">Зарегистрироваться</a></p>
    </form>
</main>
</body>
</html>
